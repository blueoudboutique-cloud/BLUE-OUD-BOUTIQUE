<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوتيك العود الأزرق</title><link rel="stylesheet" href="style.css"></head><body><header><div class="bar"><a class="brand" href="index.html">بوتيك العود الأزرق<small>BLUE OUD BOUTIQUE</small></a><nav><a class="pill" href="#products">المنتجات</a><a class="pill" href="#categories">الأقسام</a><a class="pill" href="cart.html">🛒 السلة <span id="count">0</span></a><a class="pill" href="cart.html#track">تتبع الطلب</a></nav></div></header><main><div class="hero"><h1>بوتيك العود الأزرق</h1><p id="about">عالم العود والعطور الفاخرة</p><p id="ticker" class="muted"></p></div><section id="categories" class="glass"><h2>تسوق حسب الفئة</h2><div id="cats" class="row"></div></section><section id="products"><div class="row"><h2>منتجاتنا</h2><input id="search" style="max-width:300px" placeholder="ابحث عن منتج" aria-label="البحث عن منتج"></div><div id="message" role="status"></div><div id="productsGrid" class="grid"></div></section></main><footer>BLUE OUD BOUTIQUE</footer><script type="module">
import {supabase,money,safe,getCart,setCart,report} from './supabase-config.js';
const $=id=>document.getElementById(id);let products=[],categories=[],filter='';function count(){$('count').textContent=getCart().reduce((n,x)=>n+x.qty,0)}window.addEventListener('cart-updated',count);count();
function draw(){const q=$('search').value.trim().toLowerCase();const list=products.filter(p=>(!filter||p.category_id===filter)&&p.name.toLowerCase().includes(q));$('productsGrid').innerHTML=list.map(p=>`<article class="card"><div>${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}" loading="lazy">`:'<div style="height:210px;display:grid;place-items:center">✦</div>'}</div><div class="body"><h3>${safe(p.name)}</h3><p class="muted">${safe(p.description||'')}</p><div class="row"><span class="price">${money(p.price)}</span><small>${p.stock>0?`متوفر: ${p.stock}`:'نفد المخزون'}</small></div><button class="primary" data-add="${p.id}" ${p.stock<1?'disabled':''} style="width:100%;margin-top:12px">أضف للسلة</button></div></article>`).join('')||'<p class="muted">لا توجد منتجات مطابقة.</p>'}
$('productsGrid').addEventListener('click',e=>{const b=e.target.closest('[data-add]');if(!b)return;const p=products.find(x=>x.id===b.dataset.add);if(!p)return;const a=getCart(),x=a.find(y=>y.id===p.id);if(x){if(x.qty>=p.stock)return alert('الكمية المتوفرة غير كافية');x.qty++}else a.push({id:p.id,qty:1});setCart(a);b.textContent='تمت الإضافة ✓';setTimeout(()=>b.textContent='أضف للسلة',900)});$('search').addEventListener('input',draw);
async function init(){try{const [pr,cr,sr]=await Promise.all([supabase.from('products').select('id,name,description,price,stock,image_url,category_id').eq('active',true).order('created_at',{ascending:false}),supabase.from('categories').select('id,name').eq('active',true).order('sort_order'),supabase.from('store_settings').select('key,value').eq('public_visible',true)]);for(const r of [pr,cr,sr])if(r.error)throw r.error;products=pr.data;categories=cr.data;$('cats').innerHTML='<button data-cat="" class="pill">الكل</button>'+categories.map(c=>`<button class="pill" data-cat="${c.id}">${safe(c.name)}</button>`).join('');$('cats').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b){filter=b.dataset.cat;draw()}});for(const s of sr.data){if(s.key==='about')$('about').textContent=String(s.value?.text||'');if(s.key==='ticker')$('ticker').textContent=String(s.value?.text||'')}draw()}catch(e){$('message').className='notice error';$('message').textContent='تعذر تحميل المنتجات: '+report(e)}}init();
</script></body></html>
