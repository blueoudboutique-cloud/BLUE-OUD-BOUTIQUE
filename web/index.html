<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description"
        content="بوتيك العود الأزرق للعطور والبخور والعود الفاخر">

  <meta name="theme-color" content="#800020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="بوتيك العود الأزرق">

  <title>بوتيك العود الأزرق | BLUE OUD BOUTIQUE</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #FFFFFC;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFC;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid #E8E8E8;
      border-top-color: #800020;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <div id="loading" role="status" aria-label="جارٍ تحميل المتجر">
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
    }, { once: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>

</body>
</html>
