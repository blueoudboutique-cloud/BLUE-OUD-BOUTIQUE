<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3431"><title>السلة | بوتيك العود الأزرق</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#123d38;background:#e5f0ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,#a4d2c8,transparent 35%),linear-gradient(145deg,#082b29,#1b5550 32%,#e7f0ed 75%);background-attachment:fixed}button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px 16px 70px}.glass{background:linear-gradient(145deg,#ffffffb8,#ffffff60);border:1px solid #ffffffb8;box-shadow:inset 0 1px 1px #fff,0 14px 42px #062e2b2b;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;color:#123d38}.head strong{font-size:clamp(18px,3vw,26px)}.head small{display:block;color:#8d7445;letter-spacing:2px;font-size:10px}.back{background:#ffffff8c;border:1px solid #fff;border-radius:30px;padding:11px 17px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;margin-top:22px}.panel{padding:23px}.title{margin:0 0 20px;font-size:24px}.item{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid #ffffffa8}.item:last-child{border:0}.pic{width:92px;height:100px;border-radius:18px;background:#ffffff88;display:grid;place-items:center;overflow:hidden;color:#668b86}.pic img{width:100%;height:100%;object-fit:contain}.item h3{margin:0 0 7px;font-size:16px}.muted{color:#54736e;font-size:13px}.price{font-weight:800;margin-top:6px}.qty{display:inline-flex;align-items:center;gap:14px;background:#ffffff8f;border-radius:40px;padding:5px;margin-top:12px}.qty button{width:31px;height:31px;border-radius:50%;background:#fff;border:1px solid #d4e2df;font-size:20px}.remove{color:#a12e39;background:#fff9;border:1px solid #fff;border-radius:12px;padding:8px 11px}.line{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff8c}.line.total{font-size:20px;font-weight:bold;border:0}.primary{display:block;width:100%;background:linear-gradient(125deg,#0b3733,#227168);color:white;border:1px solid #ffffff55;border-radius:17px;padding:15px;font-weight:bold;margin-top:16px;box-shadow:0 8px 20px #083c3540;text-align:center}.primary:disabled{opacity:.5;cursor:not-allowed}.field{width:100%;padding:13px;border-radius:14px;border:1px solid #ffffff;background:#ffffffb0;outline:0;margin-top:10px}.field:focus{outline:2px solid #3b8a7b}.hint{font-size:12px;color:#54736e}.empty{text-align:center;padding:70px 10px;color:#4c6b66}.tabs{display:flex;gap:8px;margin-top:22px}.tabs button{border:1px solid #ffffffa8;border-radius:16px;padding:12px 20px;background:#ffffff70;color:#17413b;font-weight:bold}.tabs button.active{background:#103c37;color:#fff}.hidden{display:none!important}.status{padding:14px;margin-top:14px;border-radius:14px;background:#ffffff9c}.steps{margin:14px 0;padding:0;list-style:none;display:grid;gap:9px}.steps li{padding:10px 14px;border-radius:12px;background:#ffffff70}.steps li.done{background:#c8e8d8;color:#075e40;font-weight:bold}@media(max-width:750px){.layout{grid-template-columns:1fr}.head{padding:15px}.panel{padding:17px}.item{grid-template-columns:70px minmax(0,1fr);gap:11px}.pic{width:70px;height:80px}.remove{grid-column:2;justify-self:start}.title{font-size:21px}}@media(prefers-reduced-motion:no-preference){button,a{transition:transform .2s,filter .2s}button:hover,a.back:hover{filter:brightness(1.06);transform:translateY(-1px)}}
</style></head><body><div class="wrap"><header class="glass head"><div><strong>بوتيك العود الأزرق</strong><small>BLUE OUD BOUTIQUE</small></div><a class="back" href="index.html">← متابعة التسوق</a></header><div class="tabs"><button id="cartTab" class="active" type="button">🛒 سلة المشتريات</button><button id="trackTab" type="button">◉ تتبع الطلب</button></div><div id="cartView" class="layout"><section class="glass panel"><h1 class="title">سلة المشتريات <span id="count" class="muted"></span></h1><div id="items"></div></section><aside class="glass panel"><h2 class="title">ملخص الطلب</h2><div class="line"><span>المنتجات</span><strong id="subtotal"></strong></div><div class="line"><span>الشحن</span><strong id="shipping"></strong></div><div class="line"><span>الخصم</span><strong id="discount">—</strong></div><div class="line total"><span>الإجمالي</span><strong id="total"></strong></div><label for="coupon">كود الخصم</label><input class="field" id="coupon" placeholder="أدخل الكود" maxlength="40" autocomplete="off"><button class="back" style="margin-top:10px" id="applyCoupon" type="button">تطبيق</button><p id="couponMsg" class="hint" role="status"></p><button id="checkout" class="primary" type="button">متابعة الدفع</button><p class="hint">يتم حفظ السلة على هذا الجهاز فقط. الدفع وتسجيل الطلبات في هذه النسخة تجريبيان.</p></aside></div><section id="trackView" class="glass panel hidden" style="margin-top:18px"><h1 class="title">تتبع طلبك</h1><p class="muted">أدخل رقم الطلب ورقم الهاتف المستخدم عند الطلب.</p><form id="trackForm"><label for="orderId">رقم الطلب</label><input class="field" id="orderId" required maxlength="80" autocomplete="off"><label for="phone">رقم الهاتف</label><input class="field" id="phone" required maxlength="30" inputmode="tel" autocomplete="tel"><button class="primary" type="submit">عرض حالة الطلب</button></form><div id="trackResult" role="status" aria-live="polite"></div></section></div><script>
'use strict';
const STORE='blueoud_store_v1',CART='blueoud_cart_v1',ORDERS='blueoud_orders_v1';const $=id=>document.getElementById(id);const read=(key,fallback)=>{try{const value=JSON.parse(localStorage.getItem(key));return value??fallback}catch{return fallback}};const money=n=>Number(n||0).toLocaleString('ar')+' ر.ي';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let coupon='';function store(){return read(STORE,{products:[],settings:{shipping:0}})}function validCart(){const products=store().products||[];return read(CART,[]).filter(c=>c&&Number.isSafeInteger(c.qty)&&c.qty>0&&products.some(p=>String(p.id)===String(c.id)&&p.active!==false)).map(c=>({...c,qty:Math.min(c.qty,Math.max(0,Math.floor(Number(products.find(p=>String(p.id)===String(c.id)).stock)||0)))})).filter(c=>c.qty>0)}function save(cart){try{localStorage.setItem(CART,JSON.stringify(cart));return true}catch{alert('تعذر حفظ السلة في المتصفح');return false}}function render(){const d=store(),cart=validCart(),p=d.products||[];const subtotal=cart.reduce((n,c)=>n+Number(p.find(x=>String(x.id)===String(c.id))?.price||0)*c.qty,0);const shipping=cart.length?Math.max(0,Number(d.settings?.shipping)||0):0;$('items').innerHTML=cart.length?cart.map(c=>{const item=p.find(x=>String(x.id)===String(c.id));const src=String(item.image||'');const img=/^(https?:\/\/|data:image\/)/i.test(src)?`<img src="${esc(src)}" alt="${esc(item.name)}">`:'صورة المنتج';return `<article class="item"><div class="pic">${img}</div><div><h3>${esc(item.name)}</h3><div class="muted">سعر القطعة: ${money(item.price)}</div><div class="price">${money(Number(item.price)*c.qty)}</div><div class="qty"><button type="button" data-id="${esc(c.id)}" data-action="plus" aria-label="زيادة الكمية">+</button><span>${c.qty}</span><button type="button" data-id="${esc(c.id)}" data-action="minus" aria-label="تقليل الكمية">−</button></div></div><button class="remove" data-id="${esc(c.id)}" data-action="remove" type="button">حذف المنتج</button></article>`}).join(''):'<div class="empty">سلتك فارغة حالياً.<br><br><a class="back" href="index.html#products">استعرض المنتجات</a></div>';$('count').textContent=`(${cart.reduce((n,c)=>n+c.qty,0)})`;$('subtotal').textContent=money(subtotal);$('shipping').textContent=money(shipping);$('total').textContent=money(subtotal+shipping);$('checkout').disabled=!cart.length;$('couponMsg').textContent=coupon?'كود الخصم غير مفعل في هذه النسخة. لم يتم احتساب خصم.':''}function adjust(id,action){const d=store(),cart=validCart(),item=cart.find(c=>String(c.id)===String(id)),product=(d.products||[]).find(p=>String(p.id)===String(id));if(!item||!product)return;const max=Math.max(0,Math.floor(Number(product.stock)||0));if(action==='remove'){if(!confirm('هل تريد حذف المنتج من السلة؟'))return;item.qty=0}else if(action==='plus'){if(item.qty>=max){alert('لا توجد كمية إضافية في المخزون');return}item.qty++}else if(action==='minus')item.qty--;if(save(cart.filter(c=>c.qty>0)))render()}$('items').addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(button)adjust(button.dataset.id,button.dataset.action)});$('applyCoupon').addEventListener('click',()=>{coupon=$('coupon').value.trim();render()});$('checkout').addEventListener('click',()=>{if(validCart().length)location.href='index.html?checkout=1'});function tab(name){const tracking=name==='track';$('cartView').classList.toggle('hidden',tracking);$('trackView').classList.toggle('hidden',!tracking);$('cartTab').classList.toggle('active',!tracking);$('trackTab').classList.toggle('active',tracking);history.replaceState(null,'',tracking?'#tracking':'#cart')}$('cartTab').onclick=()=>tab('cart');$('trackTab').onclick=()=>tab('track');$('trackForm').addEventListener('submit',e=>{e.preventDefault();const id=$('orderId').value.trim(),phone=$('phone').value.trim();const order=read(ORDERS,[]).find(o=>String(o.id)===id&&String(o.customer?.phone)===phone);const target=$('trackResult');if(!order){target.innerHTML='<div class="status">لم يتم العثور على طلب مطابق. تأكد من الرقم والهاتف، وأن الطلب سُجّل في هذا المتصفح.</div>';return}const statuses=['تم استلام الطلب','قيد التجهيز','تم الشحن','خرج للتوصيل','تم التسليم'];const position=statuses.indexOf(order.status);target.innerHTML=`<div class="status"><strong>الطلب: ${esc(order.id)}</strong><p>الحالة الحالية: ${esc(order.status)}</p><p>الإجمالي: ${money(order.total)}</p><ol class="steps">${statuses.map((s,i)=>`<li class="${position>=i?'done':''}">${esc(s)}</li>`).join('')}</ol></div>`});window.addEventListener('storage',e=>{if([CART,STORE,ORDERS].includes(e.key))render()});render();if(location.hash==='#tracking')tab('track');
</script></body></html>
