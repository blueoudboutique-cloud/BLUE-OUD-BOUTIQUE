<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السلة | بوتيك العود الأزرق</title><link rel="stylesheet" href="style.css"></head><body><header><div class="bar"><a class="brand" href="index.html">بوتيك العود الأزرق<small>BLUE OUD BOUTIQUE</small></a><nav><a class="pill" href="index.html">متابعة التسوق</a><a class="pill" href="#track">تتبع الطلب</a></nav></div></header><main><h1>🛒 سلة التسوق</h1><div id="notice" role="status"></div><section class="glass"><div id="items"></div><h2 id="total"></h2></section><section class="glass"><h2>إتمام الطلب عبر واتساب</h2><form id="checkout"><div class="formgrid"><label>الاسم الكامل<input name="name" required minlength="2" maxlength="150" autocomplete="name" placeholder="اكتب الاسم الكامل"></label><label>رقم الهاتف<input name="phone" type="tel" required minlength="7" maxlength="30" autocomplete="tel" placeholder="اكتب رقم الهاتف"></label></div><label>عنوان التوصيل<textarea name="address" required minlength="5" maxlength="1000" placeholder="المحافظة، المديرية، الحي، الشارع وأقرب معلم"></textarea></label><label>ملاحظات إضافية<textarea name="notes" maxlength="2000" placeholder="ملاحظات الطلب (اختياري)"></textarea></label><button id="confirm" class="green" type="submit">تأكيد الطلب عبر واتساب</button><p class="muted">يُسجَّل الطلب في قاعدة البيانات أولاً، ثم تُفتح رسالة واتساب. يجب الضغط على إرسال داخل واتساب لإبلاغ المتجر.</p></form><div id="success" role="status"></div></section><section id="track" class="glass"><h2>تتبع الطلب</h2><form id="trackForm"><label>رقم التتبع<input id="tracking" required maxlength="30" placeholder="أدخل رقم التتبع"></label><button class="primary">عرض الحالة</button></form><div id="trackResult" role="status"></div></section></main><script type="module">
import {supabase,money,safe,getCart,setCart,report} from './js/supabase-config.js';const $=id=>document.getElementById(id);let catalog=[];const statuses={pending:'قيد المراجعة',confirmed:'تم التأكيد',preparing:'قيد التجهيز',shipped:'تم الشحن',delivered:'تم التسليم',cancelled:'ملغي'};function notify(msg,bad=false){$('notice').className='notice'+(bad?' error':'');$('notice').textContent=msg}function lines(){return getCart().map(x=>({p:catalog.find(p=>p.id===x.id),qty:x.qty})).filter(x=>x.p)}function draw(){const a=lines();$('items').innerHTML=a.map(({p,qty})=>`<div class="item">${p.image_url?`<img src="${safe(p.image_url)}" alt="${safe(p.name)}">`:''}<div class="grow"><strong>${safe(p.name)}</strong><p class="price">${money(p.price)} × ${qty} = ${money(p.price*qty)}</p><small>المتوفر: ${p.stock}</small></div><input class="qty" type="number" min="1" max="${p.stock}" value="${qty}" data-qty="${p.id}" aria-label="كمية ${safe(p.name)}"><button class="danger" data-remove="${p.id}">حذف</button></div>`).join('')||'<p>السلة فارغة. <a href="index.html">تسوق الآن</a></p>';$('total').textContent='الإجمالي: '+money(a.reduce((s,x)=>s+x.p.price*x.qty,0));$('confirm').disabled=!a.length}function update(id,qty){const a=getCart(),x=a.find(x=>x.id===id),p=catalog.find(x=>x.id===id);if(!x||!p)return;if(!Number.isInteger(qty)||qty<1||qty>p.stock){notify('الكمية غير متوفرة',true);draw();return}x.qty=qty;setCart(a);draw()}
$('items').addEventListener('change',e=>{if(e.target.matches('[data-qty]'))update(e.target.dataset.qty,Number(e.target.value))});$('items').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(b){setCart(getCart().filter(x=>x.id!==b.dataset.remove));draw()}});
async function load(){const {data,error}=await supabase.from('products').select('id,name,price,stock,image_url').eq('active',true);if(error)throw error;catalog=data;const filtered=getCart().filter(x=>catalog.some(p=>p.id===x.id));if(filtered.length!==getCart().length){setCart(filtered);notify('تمت إزالة منتجات لم تعد متاحة')}draw()}
$('checkout').addEventListener('submit',async e=>{e.preventDefault();const btn=$('confirm');if(btn.disabled)return;const a=lines();if(!a.length)return notify('السلة فارغة',true);const fd=new FormData(e.currentTarget);const name=String(fd.get('name')||'').trim(),phone=String(fd.get('phone')||'').trim(),address=String(fd.get('address')||'').trim(),notes=String(fd.get('notes')||'').trim();if(name.length<2||phone.length<7||address.length<5)return notify('يرجى إكمال بيانات العميل',true);btn.disabled=true;try{const {data,error}=await supabase.rpc('place_order',{p_customer_name:name,p_customer_phone:phone,p_delivery_address:address,p_notes:notes,p_items:a.map(x=>({product_id:x.p.id,quantity:x.qty}))});if(error)throw error;const order=data?.[0];if(!order)throw Error('لم يتم استلام رقم الطلب');setCart([]);catalog= catalog.map(p=>({...p,stock:Math.max(0,p.stock-(a.find(x=>x.p.id===p.id)?.qty||0))}));draw();$('tracking').value=order.tracking_code;const msg=`طلب جديد - بوتيك العود الأزرق\nرقم التتبع: ${order.tracking_code}\nالعميل: ${name}\nالهاتف: ${phone}\nالعنوان: ${address}\n${notes?'ملاحظات: '+notes+'\n':''}المنتجات:\n${a.map(x=>`- ${x.p.name} × ${x.qty} = ${money(x.p.price*x.qty)}`).join('\n')}\nالإجمالي المعتمد: ${money(order.total)}\nيرجى تأكيد الطلب.`;const link='https://wa.me/967776269719?text='+encodeURIComponent(msg);$('success').innerHTML=`<div class="notice">تم تسجيل الطلب بنجاح. رقم التتبع: <strong>${safe(order.tracking_code)}</strong><br><a class="button green" style="display:inline-block;margin-top:10px" target="_blank" rel="noopener noreferrer" href="${link}">فتح واتساب لإرسال الطلب</a></div>`;window.open(link,'_blank','noopener,noreferrer')}catch(err){notify('تعذر تسجيل الطلب: '+report(err),true)}finally{btn.disabled=!lines().length}});
$('trackForm').addEventListener('submit',async e=>{e.preventDefault();const code=$('tracking').value.trim();const {data,error}=await supabase.rpc('track_order',{p_tracking_code:code});$('trackResult').textContent=error?'تعذر التتبع: '+report(error):data?.length?`حالة الطلب: ${statuses[data[0].status]||data[0].status}`:'لم يتم العثور على الطلب'});load().catch(e=>notify('تعذر تحميل السلة: '+report(e),true));
</script></body></html>
