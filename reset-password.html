<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور | بوتيك العود الأزرق</title>
<style>:root{font-family:system-ui,Tahoma,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#edf9ff,#fff8ed);color:#20344a;display:grid;place-items:center;padding:22px}.card{width:min(100%,460px);background:#ffffffec;border:1px solid #c8e7f7;border-radius:24px;box-shadow:0 16px 55px #295b7919;padding:28px}h1{font-size:1.5rem}label{display:block;margin:16px 0 6px}input{width:100%;padding:14px;border:1px solid #b6cbd8;border-radius:12px;font:inherit}button{width:100%;padding:14px;margin-top:20px;background:#197cba;color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#176fa5}#status{margin:14px 0;line-height:1.8}#status.error{color:#a32626}#status.ok{color:#14663a}.hidden{display:none}</style></head>
<body><main class="card"><h1>تعيين كلمة مرور جديدة</h1><p>بوتيك العود الأزرق — استعادة حساب الإدارة</p><div id="status" role="status" aria-live="polite">جارٍ التحقق من رابط الاستعادة…</div><form id="form" class="hidden"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button type="submit">حفظ كلمة المرور</button></form><p><a href="Amer%20Alex/admin.html" id="back">العودة إلى الإدارة</a></p></main>
<script type="module">
const status=document.getElementById('status'),form=document.getElementById('form');
const show=(message,error=false)=>{status.textContent=message;status.className=error?'error':'ok'};
const query=new URLSearchParams(location.search),fragment=new URLSearchParams(location.hash.slice(1));
const hasCode=query.has('code'),hasRecoveryHash=fragment.get('type')==='recovery'&&fragment.has('access_token')&&fragment.has('refresh_token');
const authError=query.get('error_description')||fragment.get('error_description');
if(authError){show('تعذر استخدام الرابط: '+authError,true)}
else if(!hasCode&&!hasRecoveryHash){show('هذا الرابط ليس رابط استعادة صالحًا. اطلب رسالة جديدة من لوحة الإدارة.',true)}
else{
 try{
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const supabase=createClient('https://eswsrdxhztgizqjnclnn.supabase.co','sb_publishable_eCOUMwrzy4sfyYrmkEXNEg_Vnc1hjwi',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,flowType:'implicit',storageKey:'blueoud-recovery-session'}});
  if(!hasRecoveryHash)throw Error('اطلب رابط استعادة جديدًا من لوحة الإدارة.');
  const {error}=await supabase.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
  if(error)throw error;
  const {data:{user},error:userError}=await supabase.auth.getUser();if(userError||!user)throw userError||Error('لم يتم التحقق من الحساب');
  history.replaceState(null,'',location.pathname);
  show('تم التحقق من الرابط. أدخل كلمة مرور جديدة لا تقل عن 12 حرفًا.');form.classList.remove('hidden');
  form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,button=form.querySelector('button');if(password!==confirm)return show('كلمتا المرور غير متطابقتين.',true);if(password.length<12)return show('كلمة المرور يجب أن تكون 12 حرفًا على الأقل.',true);button.disabled=true;try{const {error}=await supabase.auth.updateUser({password});if(error)throw error;await supabase.auth.signOut({scope:'local'}).catch(()=>{});form.classList.add('hidden');show('تم تغيير كلمة المرور بنجاح. ارجع إلى الإدارة وسجّل الدخول بكلمة المرور الجديدة.')}catch(error){show('تعذر تغيير كلمة المرور: '+(error?.message||'خطأ غير معروف'),true)}finally{button.disabled=false}});
 }catch(error){show('تعذر التحقق من رابط الاستعادة. اطلب رابطًا جديدًا. التفاصيل: '+(error?.message||'خطأ غير معروف'),true)}
}
</script></body></html>
