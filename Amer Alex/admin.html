button><button data-tab="banners">شاشة الإعلانات</button><button data-tab="scents">الروائح</button><button data-tab="features">مزايا المتجر</button><button data-tab="pages">الصفحات والسياسات</button></nav><section class="glass"><h2 id="formTitle"></h2><div id="formArea"></div></section><section class="glass"><h2>السجلات</h2><div id="records"></div></section></div></main><script>
(() => {
  const get = id => document.getElementById(id);
  const notice = get('message');
  const recovery = get('recoveryRequest');
  const login = get('login');
  const forgot = get('forgotPassword');
  function message(value, isError = false) {
    notice.className = 'notice' + (isError ? ' error' : '');
    notice.textContent = value;
  }
  forgot.addEventListener('click', () => {
    login.classList.add('hide');
    forgot.classList.add('hide');
    recovery.classList.remove('hide');
    recovery.elements.recovery_email.value = login.elements.email.value || '';
    message('');
  });
  get('cancelRecovery').addEventListener('click', () => {
    recovery.classList.add('hide');
    login.classList.remove('hide');
    forgot.classList.remove('hide');
    message('');
  });
  recovery.addEventListener('submit', async event => {
    event.preventDefault();
    if (!recovery.reportValidity()) return;
    const button = recovery.querySelector('button[type="submit"]');
    button.disabled = true;
    message('جارٍ إرسال رابط الاستعادة…');
    try {
      // Independent from admin module, which can fail for unrelated database reasons.
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const client = createClient(
        'https://eswsrdxhztgizqjnclnn.supabase.co',
        'sb_publishable_eCOUMwrzy4sfyYrmkEXNEg_Vnc1hjwi',
        { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
      );
      const redirectTo = new URL('../reset-password.html', window.location.href).href;
      const email = recovery.elements.recovery_email.value.trim();
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      message('تم طلب رابط الاستعادة. افحص البريد الوارد والرسائل غير المرغوبة، واستخدم أحدث رسالة.');
    } catch (error) {
      console.error('Password recovery request failed:', error);
      message('تعذر إرسال رابط الاستعادة: ' + (error?.message || String(error)), true);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
<script type="module">
// Supports admin.html at repository root OR one subfolder below it.
const base = location.pathname.split('/').filter(Boolean);

document.querySelector('#storeStyles').href = prefix + 'style.css';

const $=id=>document.getElementById(id);let tab='products',editing=null,products=[],categories=[],orders=[],settings=[],extras={banners:[],scents:[],features:[],pages:[]};function msg(t,bad=false){$('message').className='notice'+(bad?' error':'');$('message').textContent=t}function option(id,selected){return categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${safe(c.name)}</option>`).join('')}
async function check(){const {data:{user},error}=await supabase.auth.getUser();if(error){msg('تعذر التحقق من الجلسة: '+report(error),true);return false}if(!user)return false;const {data,error:err}=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(err){msg('تعذر التحقق من صلاحية المدير: '+report(err),true);return false}if(!data){msg('الحساب لا يمتلك صلاحية المدير. تحقق من جدول admin_users',true);return false}return true}

async function refresh(){
 // Load only the selected tab: missing optional tables must not disable the entire dashboard.
 const query = (table, sort) => {
   let q = supabase.from(table).select('*');
   if(sort) q=q.order(sort,{ascending:sort==='sort_order'});
   return q;
 };
 const tasks = [];
 if(tab==='products') tasks.push(['products',query('products','created_at')],['categories',query('categories','sort_order')]);
 else if(tab==='categories') tasks.push(['categories',query('categories','sort_order')]);
 else if(tab==='orders') tasks.push(['orders',query('orders','created_at').limit(100)]);
 else if(tab==='settings') tasks.push(['store_settings',query('store_settings')]);
 else if(Object.hasOwn(extras,tab)) tasks.push([tab,query(tab)]);
 const responses=await Promise.all(tasks.map(async ([name,promise])=>({name,...await promise})));
 const failures=responses.filter(r=>r.error);
 for(const r of responses){
   if(r.error) continue;
   if(r.name==='products') products=r.data||[];
   else if(r.name==='categories') categories=r.data||[];
   else if(r.name==='orders') orders=r.data||[];
   else if(r.name==='store_settings') settings=r.data||[];
   else extras[r.name]=r.data||[];
 }
 render();
 if(failures.length) msg('تعذر تحميل '+failures.map(r=>r.name+': '+report(r.error)).join(' | '),true);
}
function render(){const collection=tab==='products'?products:tab==='categories'?categories:(extras[tab]||[]);const p=collection.find(x=>x.id===editing)||{};$('formTitle').textContent=tab==='products'?'إضافة أو تعديل منتج':tab==='categories'?'إضافة أو تعديل قسم':tab==='orders'?'إدارة الطلبات':tab==='settings'?'إعدادات المتجر':({banners:'إضافة أو تعديل إعلان',scents:'إضافة أو تعديل رائحة',features:'إضافة أو تعديل ميزة',pages:'إضافة أو تعديل صفحة'}[tab]||'إدارة المحتوى');if(tab==='products'){$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>اسم المنتج<input name="name" required maxlength="200" value="${safe(p.name)}"></label><label>السعر (ر.ي)<input name="price" type="number" step="0.01" min="0" required value="${p.price??0}"></label><label>السعر قبل الخصم<input name="compare_at_price" type="number" step="0.01" min="0" value="${p.compare_at_price??''}"></label><label>المخزون<input name="stock" type="number" min="0" step="1" required value="${p.stock??0}"></label><label>القسم<select name="category_id"><option value="">بدون قسم</option>${option('',p.category_id)}</select></label><label class="image-picker">صورة المنتج من الجهاز<input id="productImage" name="product_image" type="file" accept="image/jpeg,image/png,image/webp" style="display:block;width:100%;margin-top:10px" aria-describedby="imageHelp"><small id="imageHelp" class="muted">JPG أو PNG أو WebP — الحد الأقصى 5 ميجابايت. عند التعديل، اترك الحقل فارغًا للاحتفاظ بالصورة الحالية.</small><img id="imagePreview" alt="معاينة صورة المنتج" style="${p.image_url?'':'display:none;'};max-width:180px;max-height:180px;object-fit:contain;border-radius:18px;margin-top:12px;border:1px solid #dfe3e9" src="${safe(p.image_url)}"></label></div><label>الوصف<textarea name="description">${safe(p.description)}</textarea></label><label><input type="checkbox" name="active" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> المنتج ظاهر للعملاء</label><label><input type="checkbox" name="featured" style="width:auto;min-height:auto" ${p.featured?'checked':''}> منتج مميز</label><button class="primary">حفظ المنتج</button><button type="button" id="cancel">إلغاء التعديل</button></form>`}else if(tab==='categories'){$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>اسم القسم<input name="name" required maxlength="100" value="${safe(p.name)}"></label><label>معرّف القسم بالإنجليزية<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" value="${safe(p.slug)}" placeholder="oud-perfumes"></label><label>الترتيب<input type="number" name="sort_order" value="${p.sort_order??0}"></label></div><label><input type="checkbox" name="active" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> القسم ظاهر</label><button class="primary">حفظ القسم</button><button type="button" id="cancel">إلغاء التعديل</button></form>`}else if(Object.hasOwn(extras,tab)){
const isPage=tab==='pages',isBanner=tab==='banners';
$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>${isBanner?'عنوان الإعلان':'الاسم'}<input name="name" required maxlength="160" value="${safe(p.name)}"></label><label>الترتيب<input name="sort_order" type="number" min="0" max="9999" value="${p.sort_order??0}"></label>${isBanner?`<label>رابط الوجهة (اختياري)<input name="link_url" type="url" maxlength="1000" value="${safe(p.link_url)}" placeholder="https://..."></label>`:''}${isPage?`<label>المعرّف بالإنجليزية<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100" value="${safe(p.slug)}"></label>`:''}</div>${!isPage?`<label>الصورة من الجهاز (اختياري)<input name="content_image" type="file" accept="image/jpeg,image/png,image/webp" style="display:block"><small class="muted">JPG / PNG / WebP — حتى 5 ميجابايت</small>${p.image_url?`<img alt="الصورة الحالية" src="${safe(p.image_url)}" style="display:block;max-width:150px;max-height:140px;object-fit:contain;margin:12px 0;border-radius:14px">`:''}</label>`:''}<label>${isPage?'محتوى الصفحة':'الوصف أو النص الإضافي'}<textarea name="description" maxlength="10000">${safe(p.description)}</textarea></label><label><input name="active" type="checkbox" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> ظاهر للعملاء</label><button class="primary">حفظ</button><button type="button" id="cancel">إلغاء التعديل</button></form>`;
}else if(tab==='settings'){$('formArea').innerHTML=`<form id="editor"><label>نبذة المتجر<input name="about" value="${safe(settings.find(x=>x.key==='about')?.value?.text||'')}"></label><label>شعار المتجر من الجهاز (JPG / PNG / WebP)<input name="logo_image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>الشريط الإعلاني<input name="ticker" value="${safe(settings.find(x=>x.key==='ticker')?.value?.text||'')}"></label><button class="primary">حفظ الإعدادات</button></form>`}else $('formArea').innerHTML='<p class="muted">يمكنك تحديث حالة الطلب من السجلات أدناه.</p>';

const f=$('editor');if(f)f.addEventListener('submit',save);if(tab==='products'){const picker=$('productImage'),preview=$('imagePreview');let objectUrl=null;picker?.addEventListener('change',()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}const file=picker.files?.[0];if(!file){preview.src='';preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024||file.size===0){picker.value='';msg('اختر صورة JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميجابايت',true);return}objectUrl=URL.createObjectURL(file);preview.src=objectUrl;preview.style.display='block';preview.onload=()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}})}$('cancel')?.addEventListener('click',()=>{editing=null;render()})}
async function save(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f),button=f.querySelector('[type=submit],button');button.disabled=true;let uploadedPath=null;try{let result;if(tab==='settings'){const rows=['about','ticker'].map(key=>({key,value:{text:String(fd.get(key)||'').trim()},public_visible:true}));const logoFile=fd.get('logo_image');if(logoFile instanceof File&&logoFile.size>0){const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};const ext=extensions[logoFile.type];if(!ext||logoFile.size>5*1024*1024)throw Error('الشعار يجب أن يكون JPG أو PNG أو WebP بحجم أقل من 5 ميجابايت');const {data:{user},error:authError}=await supabase.auth.getUser();if(authError||!user)throw Error('يجب تسجيل دخول المدير');uploadedPath=`${user.id}/logo-${crypto.randomUUID()}.${ext}`;const {error:upError}=await supabase.storage.from('product-images').upload(uploadedPath,logoFile,{contentType:logoFile.type,upsert:false});if(upError)throw Error('فشل رفع الشعار: '+report(upError));const {data:publicData}=supabase.storage.from('product-images').getPublicUrl(uploadedPath);rows.push({key:'logo_url',value:{text:publicData.publicUrl},public_visible:true})}result=await supabase.from('store_settings').upsert(rows)}else if(tab==='products'){const price=Number(fd.get('price')),compare=fd.get('compare_at_price')===''?null:Number(fd.get('compare_at_price')),stock=Number(fd.get('stock'));if(!Number.isFinite(price)||price<0||compare!==null&&compare<price||!Number.isInteger(stock)||stock<0)throw Error('تحقق من السعر والمخزون');const file=fd.get('product_image');let image=editing?(products.find(p=>p.id===editing)?.image_url||null):null;if(file instanceof File&&file.size>0){const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};const extension=types[file.type];if(!extension||file.size>5*1024*1024)throw Error('صيغة الصورة غير مدعومة أو حجمها أكبر من 5 ميجابايت');const {data:{user},error:userError}=await supabase.auth.getUser();if(userError||!user)throw Error('انتهت جلسة المدير، سجل الدخول مجددًا');uploadedPath=`${user.id}/${crypto.randomUUID()}.${extension}`;const {error:uploadError}=await supabase.storage.from('product-images').upload(uploadedPath,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(uploadError)throw Error('تعذر رفع الصورة: '+report(uploadError));const {data:publicData}=supabase.storage.from('product-images').getPublicUrl(uploadedPath);image=publicData.publicUrl;}const obj={name:String(fd.get('name')).trim(),price,compare_at_price:compare,stock,category_id:fd.get('category_id')||null,image_url:image||null,description:String(fd.get('description')||''),active:fd.has('active'),featured:fd.has('featured')};result=editing?await supabase.from('products').update(obj).eq('id',editing):await supabase.from('products').insert(obj)}else if(Object.hasOwn(extras,tab)){
const existing=editing?extras[tab].find(x=>x.id===editing):null;
let image=existing?.image_url||null;
if(tab!=='pages'){
const file=fd.get('content_image');
if(file instanceof File&&file.size){
const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
if(!extensions[file.type]||file.size>5242880)throw Error('اختر صورة JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميجابايت');
const {data:{user},error:authError}=await supabase.auth.getUser();
if(authError||!user)throw Error('انتهت جلسة المدير');
uploadedPath=`${user.id}/${crypto.randomUUID()}.${extensions[file.type]}`;
const {error:uploadError}=await supabase.storage.from('product-images').upload(uploadedPath,file,{contentType:file.type,upsert:false});
if(uploadError)throw Error('تعذر رفع الصورة: '+report(uploadError));
image=supabase.storage.from('product-images').getPublicUrl(uploadedPath).data.publicUrl;
}}
const obj={name:String(fd.get('name')||'').trim(),description:String(fd.get('description')||'').trim(),sort_order:Number(fd.get('sort_order')),active:fd.has('active')};
if(!obj.name||!Number.isInteger(obj.sort_order)||obj.sort_order<0||obj.sort_order>9999)throw Error('تحقق من الاسم والترتيب');

else obj.image_url=image;
if(tab==='banners'){

if(link){const url=new URL(link);if(url.protocol!=='https:')throw Error('رابط الإعلان يجب أن يبدأ بـ HTTPS');}
