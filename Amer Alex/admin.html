e="button" id="forgotPassword" style="margin-top:12px;background:transparent;border:0;text-decoration:underline;cursor:pointer;color:inherit">نسيت كلمة المرور؟</button><form id="recoveryRequest" class="hide" style="margin-top:16px"><label>البريد الإلكتروني لاستعادة كلمة المرور<input name="recovery_email" type="email" autocomplete="email" required></label><button class="primary" type="submit">إرسال رابط الاستعادة</button><button type="button" id="cancelRecovery">رجوع</button></form></section><div class="hide" id="dashboard"><h1>إدارة المتجر</h1><nav class="row" style="display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between"><button data-tab="products">المنتجات</button><button data-tab="categories">الأقسام</button><button data-tab="orders">الطلبات</button><button data-tab="settings">الإعدادات</button><button data-tab="banners">الإعلانات العلوية</button><button data-tab="scents">الروائح</button><button data-tab="features">مزايا المتجر</button><button data-tab="pages">الصفحات والسياسات</button><button data-tab="ticker">شريط الإعلانات</button><button data-tab="lower">الإعلانات السفلية</button><button data-tab="brands">الماركات</button><button data-tab="profile">البروفايل</button><button data-tab="splash">شاشة البداية</button><button data-tab="coupons">الكوبونات</button><button data-tab="lock">قفل الإدارة</button><button data-tab="currency">عملة المتجر</button></nav><section class="glass"><h2 id="formTitle"></h2><div id="formArea"></div></section><section class="glass"><h2>السجلات</h2><div id="records"></div></section></div></main><script>
(() => {
  const get = id => document.getElementById(id);
  const notice = get('message');
  const recovery = get('recoveryRequest');
  const login = get('login');
  const forgot = get('forgotPassword');
  function message(value, isError = false) {
    notice.className = 'notice' + (isError ? ' error' : '');
    notice.textContent = value;
  }
  forgot.addEventListener('click', () => {
    login.classList.add('hide');
    forgot.classList.add('hide');
    recovery.classList.remove('hide');
    recovery.elements.recovery_email.value = login.elements.email.value || '';
    message('');
  });
  get('cancelRecovery').addEventListener('click', () => {
    recovery.classList.add('hide');
    login.classList.remove('hide');
    forgot.classList.remove('hide');
    message('');
  });
  recovery.addEventListener('submit', async event => {
    event.preventDefault();
    if (!recovery.reportValidity()) return;
    const button = recovery.querySelector('button[type="submit"]');
    button.disabled = true;
    message('جارٍ إرسال رابط الاستعادة…');
    try {
      // Independent from admin module, which can fail for unrelated database reasons.
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const client = createClient(
        'https://eswsrdxhztgizqjnclnn.supabase.co',
        'sb_publishable_eCOUMwrzy4sfyYrmkEXNEg_Vnc1hjwi',
        { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, flowType: 'implicit', storageKey: 'blueoud-recovery-request' } }
      );
      const segments = window.location.pathname.split('/').filter(Boolean);
      const adminIsInSubfolder = segments.length > 2;
      const redirectTo = 'https://blueoudboutique-cloud.github.io/BLUE-OUD-BOUTIQUE/reset-password.html';
      const email = recovery.elements.recovery_email.value.trim();
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      message('تم طلب رابط الاستعادة. افحص البريد الوارد والرسائل غير المرغوبة، واستخدم أحدث رسالة.');
    } catch (error) {
      console.error('Password recovery request failed:', error);
      message('تعذر إرسال رابط الاستعادة: ' + (error?.message || String(error)), true);
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
<script type="module">
// Supports admin.html at repository root OR one subfolder below it.
const base = location.pathname.split('/').filter(Boolean);
const inSubfolder = base.length > 2; // GitHub Pages: /repo/admin.html vs /repo/folder/admin.html
const prefix = inSubfolder ? '../' : './';
document.querySelector('#storeStyles').href = prefix + 'style.css';
document.querySelectorAll('a[href="index.html"]').forEach(a => a.href = prefix + 'index.html');

const $=id=>document.getElementById(id);let tab='products',editing=null,products=[],categories=[],orders=[],settings=[],extras={banners:[],scents:[],features:[],pages:[]};function msg(t,bad=false){$('message').className='notice'+(bad?' error':'');$('message').textContent=t}function option(id,selected){return categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${safe(c.name)}</option>`).join('')}
async function check(){const {data:{user},error}=await supabase.auth.getUser();if(error){msg('تعذر التحقق من الجلسة: '+report(error),true);return false}if(!user)return false;const {data,error:err}=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(err){msg('تعذر التحقق من صلاحية المدير: '+report(err),true);return false}if(!data){msg('الحساب لا يمتلك صلاحية المدير. تحقق من جدول admin_users',true);return false}return true}
async function enter(){const allowed=await check();$('loginPanel').classList.toggle('hide',allowed);$('dashboard').classList.toggle('hide',!allowed);$('logout').classList.toggle('hide',!allowed);if(allowed)await refresh()}
$('login').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),btn=e.currentTarget.querySelector('button');btn.disabled=true;const {error}=await supabase.auth.signInWithPassword({email:String(fd.get('email')),password:String(fd.get('password'))});btn.disabled=false;if(error)return msg('تعذر تسجيل الدخول: '+report(error),true);await enter()});$('logout').addEventListener('click',async()=>{await supabase.auth.signOut();$('dashboard').classList.add('hide');$('loginPanel').classList.remove('hide');$('logout').classList.add('hide')});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;editing=null;refresh().catch(err=>msg('تعذر تحميل القسم: '+report(err),true))}));

let productBrands=[];
const customTabs=['ticker','lower','brands','profile','splash','coupons','lock','currency'];let orderStats='';
const labels={ticker:'شريط الإعلانات',lower:'الإعلانات السفلية',brands:'الماركات',profile:'البروفايل',splash:'شاشة البداية',coupons:'الكوبونات',lock:'قفل الإدارة',currency:'عملة المتجر'};
async function customRender(){const t=tab; $('formTitle').textContent=labels[t];$('records').replaceChildren();const host=$('formArea');host.replaceChildren();const form=document.createElement('form');host.append(form);const field=(name,label,type='text',value='')=>{const l=document.createElement('label');l.textContent=label;const el=document.createElement('input');el.name=name;el.type=type;el.value=value;l.append(el);form.append(l);return el};const button=(parent,text,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=async()=>{b.disabled=true;try{await fn()}catch(e){msg(report(e),true)}finally{b.disabled=false}};parent.append(b);return b};const run=async(fn)=>{if(!await check())throw Error('غير مصرح');await fn();if(tab===t)await customRender();msg('تم الحفظ')};const query=async(q)=>{const r=await q;if(r.error)throw r.error;return r.data};
if(t==='lock'){const email=field('email','البريد الإلكتروني الجديد','email');const pass=field('password','كلمة المرور الجديدة','password');pass.minLength=12;button(form,'حفظ بيانات الدخول',()=>run(async()=>{const attrs={};if(email.value.trim())attrs.email=email.value.trim();if(pass.value){if(pass.value.length<12)throw Error('كلمة المرور 12 حرفاً على الأقل');attrs.password=pass.value}if(!Object.keys(attrs).length)throw Error('أدخل البيانات الجديدة');await query(supabase.auth.updateUser(attrs));alert('قد يتطلب تغيير البريد تأكيداً عبر البريد الإلكتروني')}));return;}
if(t==='currency'||t==='ticker'||t==='profile'||t==='splash'){const key={currency:'currency',ticker:'ticker',profile:'profile_url',splash:'splash_url'}[t];const rows=await query(supabase.from('store_settings').select('value').eq('key',key));if(tab!==t)return;const old=rows[0]?.value?.text||'';let input;if(t==='currency'){input=document.createElement('select');for(const [v,n] of [['YER','الريال اليمني'],['SAR','الريال السعودي'],['USD','الدولار']])input.add(new Option(n,v));input.value=old||'YER';form.append(input)}else if(t==='ticker')input=field('text','النص الإعلاني','text',old);else{input=field('image','رفع صورة','file');input.accept='image/jpeg,image/png,image/webp';if(old){const img=document.createElement('img');img.src=old;img.style.maxWidth='180px';form.append(img)}}button(form,'حفظ',()=>run(async()=>{const value=input.type==='file'?await uploadNew(input.files[0]):input.value;await query(supabase.from('store_settings').upsert({key,value:{text:value},public_visible:true}));if(t==='currency')setCurrency(value)}));if(t!=='currency')button(form,'حذف',()=>run(()=>query(supabase.from('store_settings').delete().eq('key',key))));return;}
const table=t==='lower'?'lower_banners':t;const rows=await query(supabase.from(table).select('*'));if(tab!==t)return;const row=rows.find(x=>x.id===editing);let name,photo,percent,start,end;if(t==='coupons'){name=field('code','رمز الكوبون','text',row?.code||'');percent=field('percent','نسبة الخصم','number',row?.percent||'');start=field('start','بداية الصلاحية','datetime-local',row?localDate(row.starts_at):'');end=field('end','نهاية الصلاحية','datetime-local',row?localDate(row.ends_at):'')}else{if(t==='brands')name=field('name','اسم الماركة','text',row?.name||'');photo=field('image','رفع الصور','file');photo.accept='image/jpeg,image/png,image/webp';photo.multiple=t==='lower'&&!row;}
button(form,'حفظ',()=>run(async()=>{let values=[];if(t==='coupons'){const code=name.value.trim().toUpperCase(),n=Number(percent.value);if(!/^[A-Z0-9_-]{2,40}$/.test(code)||!(n>0&&n<=100)||!start.value||!end.value||start.value>=end.value)throw Error('تحقق من الرمز والنسبة والمدة');values=[{code,percent:n,starts_at:new Date(start.value).toISOString(),ends_at:new Date(end.value).toISOString()}]}else{if(t==='brands'&&!name.value.trim())throw Error('أدخل الاسم');const files=[...photo.files];if(!files.length&&!row?.image_url)throw Error('اختر صورة');for(const f of files.length?files:[null])values.push({... (t==='brands'?{name:name.value.trim()}:{}),image_url:f?await uploadNew(f):row.image_url})}await query(row?supabase.from(table).update(values[0]).eq('id',row.id):supabase.from(table).insert(values));editing=null}));if(row)button(form,'إلغاء',()=>{editing=null;return customRender()});for(const x of rows){const div=document.createElement('div');div.className='item';div.textContent=x.name||x.code||'صورة إعلانية';if(x.image_url){const img=document.createElement('img');img.src=x.image_url;img.style.maxWidth='120px';div.append(img)}if(t==='coupons')div.append(` — ${x.percent}% — ${new Date(x.ends_at).toLocaleString('ar')}`);button(div,'تعديل',()=>{editing=x.id;return customRender()});button(div,'حذف',()=>{if(confirm('حذف السجل؟'))return run(()=>query(supabase.from(table).delete().eq('id',x.id)))});$('records').append(div)}}
function localDate(s){const d=new Date(s);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function uploadNew(f){if(!f||!['image/jpeg','image/png','image/webp'].includes(f.type)||!f.size||f.size>5242880)throw Error('اختر صورة صالحة حتى 5 ميجابايت');const {data:{user},error}=await supabase.auth.getUser();if(error||!user)throw Error('انتهت الجلسة');const path=user.id+'/'+crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[f.type]);const bucket=supabase.storage.from('product-images');const r=await bucket.upload(path,f,{contentType:f.type});if(r.error)throw r.error;return bucket.getPublicUrl(path).data.publicUrl}

async function refresh(){
 if(customTabs.includes(tab)) return customRender();
 if(tab==='orders'){const r=await supabase.from('orders').select('id',{count:'exact',head:true}); const q=await supabase.from('orders').select('id',{count:'exact',head:true}).in('status',['confirmed','preparing','shipped','delivered']); if(r.error||q.error)throw r.error||q.error; orderStats=`إجمالي الطلبات المسجلة: ${r.count} | المعتمدة من الإدارة: ${q.count}`;}

   let q = supabase.from(table).select('*');
   if(sort) q=q.order(sort,{ascending:sort==='sort_order'});
   return q;
 };
 const tasks = [];
 if(tab==='products') tasks.push(['products',query('products','created_at')],['categories',query('categories','sort_order')],['brands',query('brands')]);
 else if(tab==='categories') tasks.push(['categories',query('categories','sort_order')]);
 else if(tab==='orders') tasks.push(['orders',query('orders','created_at').limit(100)]);

 const responses=await Promise.all(tasks.map(async ([name,promise])=>({name,...await promise})));

function render(){const collection=tab==='products'?products:tab==='categories'?categories:(extras[tab]||[]);const p=collection.find(x=>x.id===editing)||{};$('formTitle').textContent=tab==='products'?'إضافة أو تعديل منتج':tab==='categories'?'إضافة أو تعديل قسم':tab==='orders'?'إدارة الطلبات':tab==='settings'?'إعدادات المتجر':({banners:'إضافة أو تعديل إعلان',scents:'إضافة أو تعديل رائحة',features:'إضافة أو تعديل ميزة',pages:'إضافة أو تعديل صفحة'}[tab]||'إدارة المحتوى');if(tab==='products'){$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>اسم المنتج<input name="name" required maxlength="200" value="${safe(p.name)}"></label><label>السعر<input name="price" type="number" step="0.01" min="0" required value="${p.price??0}"></label><label>السعر قبل الخصم<input name="compare_at_price" type="number" step="0.01" min="0" value="${p.compare_at_price??''}"></label><label>المخزون<input name="stock" type="number" min="0" step="1" required value="${p.stock??0}"></label><label>القسم<select name="category_id"><option value="">بدون قسم</option>${option('',p.category_id)}</select></label><label>الماركة<select name="brand_id"><option value="">بدون ماركة</option>${productBrands.map(b=>`<option value="${safe(b.id)}" ${p.brand_id===b.id?'selected':''}>${safe(b.name)}</option>`).join('')}</select></label><label class="image-picker">صورة المنتج من الجهاز<input id="productImage" name="product_image" type="file" accept="image/jpeg,image/png,image/webp" style="display:block;width:100%;margin-top:10px" aria-describedby="imageHelp"><small id="imageHelp" class="muted">JPG أو PNG أو WebP — الحد الأقصى 5 ميجابايت. عند التعديل، اترك الحقل فارغًا للاحتفاظ بالصورة الحالية.</small><img id="imagePreview" alt="معاينة صورة المنتج" style="${p.image_url?'':'display:none;'};max-width:180px;max-height:180px;object-fit:contain;border-radius:18px;margin-top:12px;border:1px solid #dfe3e9" src="${safe(p.image_url)}"></label></div><label>الوصف<textarea name="description">${safe(p.description)} $('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>${isBanner?'عنوان الإعلان':'الاسم'}<input name="name" required maxlength="160" value="${safe(p.name)}"></label><label>الترتيب<input name="sort_order" type="number" min="0" max="9999" value="${p.sort_order??0}"></label>${isBanner?`<label>رابط الوجهة (اختياري)<input name="link_url" type="url" maxlength="1000" value="${safe(p.link_url)}" placeholder="https://..."></label>`:''}${isPage?`<label>رابط السياسة<input name="policy_url" type="url" value="${safe(p.policy_url)}"></label><label>المعرّف بالإنجليزية<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100" value="${safe(p.slug)}"></label>`:''}</div>${!isPage?`<label>الصورة من الجهاز (اختياري)<input name="content_image" type="file" accept="image/jpeg,image/png,image/webp" style="display:block"><small class="muted">JPG / PNG / WebP — حتى 5 ميجابايت</small>${p.image_url?`<img alt="الصورة الحالية" src="${safe(p.image_url)}" style="display:block;max-width:150px;max-height:140px;object-fit:contain;margin:12px 0;border-radius:14px">`:''}</label>`:''}<label>${isPage?'محتوى الصفحة':'الوصف أو النص الإضافي'}<textarea name="description" maxlength="10000">${safe(p.description)}</textarea></label><label><input name="active" type="checkbox" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> ظاهر للعملاء</label><button class="primary">حفظ</button><button type="button" id="cancel">إلغاء التعديل</button></form>`;
}else if(tab==='settings'){$('formArea').innerHTML=`<form id="editor"><label>نبذة المتجر<input name="about" value="${safe(settings.find(x=>x.key==='about')?.value?.text||'')}"></label><label>شعار المتجر من الجهاز (JPG / PNG / WebP)<input name="logo_image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>الشريط الإعلاني<input name="ticker" value="${safe(settings.find(x=>x.key==='ticker')?.value?.text||'')}"></label><button class="primary">حفظ الإعدادات</button></form>`}else $('formArea').textContent=orderStats;
if(tab==='orders')$('records').innerHTML=orders.map(o=>`<div class="item"><div class="grow"><b>${safe(o.tracking_code)}</b> — ${safe(o.customer_name)}<br><span class="muted">${safe(o.customer_phone)} | ${safe(o.delivery_address)}</span><br>${money(o.total)}</div><select style="max-width:190px" data-status="${o.id}">${[['pending','قيد المراجعة'],['confirmed','مؤكد'],['preparing','قيد التجهيز'],['shipped','تم الشحن'],['delivered','تم التسليم'],['cancelled','ملغي']].map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<p>لا توجد طلبات</p>';else if(tab==='settings')$('records').innerHTML='<p class="muted">الإعدادات العامة تظهر في المتجر بعد تحديث الصفحة.</p>';else if(tab==='banners')$('records').innerHTML=`<div class="banner-grid">${collection.map(x=>`<article class="banner-card">${x.image_url?`<img src="${safe(x.image_url)}" alt="صورة الإعلان" loading="lazy">`:'<p>لا توجد صورة</p>'}<div class="banner-actions"><button data-edit="${safe(x.id)}">تعديل الصورة</button><button class="danger" data-delete="${safe(x.id)}">حذف</button></div></article>`).join('')||'<p>لا توجد صور إعلانية بعد.</p>'}</div>`;else $('records').innerHTML=collection.map(x=>`<div class="item"><div class="grow"><b>${safe(x.name)}</b> ${tab==='products'?money(x.price):''}<br><small>${safe(x.id)}</small></div><button data-edit="${x.id}">تعديل</button><button class="danger" data-delete="${x.id}">حذف</button></div>`).join('')||'<p>لا توجد سجلات</p>';
if(tab==='banners'){$('bannerPicker').addEventListener('change',()=>{const picker=$('bannerPicker'),preview=$('bannerPreview');preview.replaceChildren();const files=Array.from(picker.files);if(files.some(file=>!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5242880||!file.size)){picker.value='';msg('اختر صورًا صالحة لا تتجاوز 5 ميجابايت لكل صورة',true);return}for(const file of files){const img=document.createElement('img');img.alt='معاينة الإعلان';const url=URL.createObjectURL(file);img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url;preview.append(img)}})}const f=$('editor');if(f)f.addEventListener('submit',save);if(tab==='products'){const picker=$('productImage'),preview=$('imagePreview');let objectUrl=null;picker?.addEventListener('change',()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}const file=picker.files?.[0];if(!file){preview.src='';preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024||file.size===0){picker.value='';msg('اختر صورة JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميجابايت',true);return}objectUrl=URL.createObjectURL(file);preview.src=objectUrl;preview.style.display='block';preview.onload=()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}})}$('cancel')?.addEventListener('click',()=>{editing=null;render()})}
async function saveBanners(form){
 const files=Array.from(form.elements.content_image.files), id=editing;
 const controls=[...document.querySelectorAll('#dashboard button,#dashboard input,#logout')];
 if(!files.length||id&&files.length!==1)return msg('اختر الصور المطلوبة',true);
 if(files.some(f=>!['image/jpeg','image/png','image/webp'].includes(f.type)||!f.size||f.size>5242880))return msg('صيغة أو حجم الصورة غير صالح',true);
 controls.forEach(c=>c.disabled=true);let completed=0;
 try{
  if(!await check())throw Error('يجب تسجيل الدخول بحساب المدير');
  const {data:{user},error}=await supabase.auth.getUser();if(error||!user)throw Error('انتهت الجلسة');
  const bucket=supabase.storage.from('product-images');
  let order=extras.banners.reduce((max,x)=>Math.max(max,Number(x.sort_order)||0),-1)+1;
  for(const file of files){
   msg(`جارٍ رفع الصورة ${completed+1} من ${files.length}…`);
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
   const path=`${user.id}/${crypto.randomUUID()}.${ext}`;
   const {error:up}=await bucket.upload(path,file,{contentType:file.type,upsert:false});if(up)throw up;
   try{
    const image_url=bucket.getPublicUrl(path).data.publicUrl;
    const result=id?await supabase.from('banners').update({image_url}).eq('id',id).select('id').single():await supabase.from('banners').insert({title:'إعلان',name:'إعلان',image_url,active:true,sort_order:order++}).select('id').single();
    if(result.error)throw result.error;
   }catch(err){const {error:cleanup}=await bucket.remove([path]);if(cleanup)console.warn('Storage cleanup failed',cleanup);throw err;}
   completed++;
  }
  editing=null;await refresh();msg(id?'تم تعديل الصورة بنجاح':`تم إضافة ${completed} صورة بنجاح`);
 }catch(err){editing=null;await refresh().catch(console.error);msg(`تم حفظ ${completed} من ${files.length} — ${report(err)}`,true)}finally{controls.forEach(c=>c.disabled=false)}
}
async function save(e){e.preventDefault();if(tab==='banners')return saveBanners(e.currentTarget);const f=e.currentTarget,fd=new FormData(f),button=f.querySelector('[type=submit],button');button.disabled=true;let uploadedPath=null;try{let result;if(tab==='settings'){const rows=['about','ticker'].map(key=>({key,value:{text:String(fd.get(key)||'').trim()},public_visible:true}));const logoFile=fd.get('logo_image');if(logoFile instanceof File&&logoFile.size>0){const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};const ext=extensions[logoFile.type];if(!ext||logoFile.size>5*1024*1024)throw Error('الشعار يجب أن يكون JPG أو PNG أو WebP بحجم أقل من 5 ميجابايت');const {data:{user},error:authError}=await supabase.auth.getUser();if(authError||!user)throw Error('يجب تسجيل دخول المدير');uploadedPath=`${user.id}/logo-${crypto.randomUUID()}.${ext}`;const {error:upError}=await supabase.storage.from('product-images').upload(uploadedPath,logoFile,{contentType:logoFile.type,upsert:false});if(upError)throw Error('فشل رفع الشعار: '+report(upError));const {data:publicData}=supabase.storage.from('product-images').getPublicUrl(uploadedPath);rows.push({key:'logo_url',value:{text:publicData.publicUrl},public_visible:true})}result=await supabase.from('store_settings').upsert(rows)}else if(tab==='products'){const price=Number(fd.get('price')),compare=fd.get('compare_at_price')===''?null:Number(fd.get('compare_at_price')),stock=Number(fd.get('stock'));if(!Number.isFinite(price)||price<0||compare!==null&&compare<price||!Number.isInteger(stock)||stock<0)throw Error('تحقق من السعر والمخزون');const file=fd.get('product_image');let image=editing?(products.find(p=>p.id===editing)?.image_url||null):null;if(file instanceof File&&file.size>0){const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};const extension=types[file.type];if(!extension||file.size>5*1024*1024)throw Error('صيغة الصورة غير مدعومة أو حجمها أكبر من 5 ميجابايت');const {data:{user},error:userError}=await supabase.auth.getUser();if(userError||!user)throw Error('انتهت جلسة المدير، سجل الدخول مجددًا');uploadedPath=`${user.id}/${crypto.randomUUID()}.${extension}`;const {error:uploadError}=await supabase.storage.from('product-images').upload(uploadedPath,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(uploadError)throw Error('تعذر رفع الصورة: '+report(uploadError));const {data:publicData}=supabase.storage.from('product-images').getPublicUrl(uploadedPath);image=publicData.publicUrl;}const obj={name:String(fd.get('name')).trim(),price,compare_at_price:compare,stock,category_id:fd.get('category_id')||null,brand_id:fd.get('brand_id')||null,image_url:image||null,description:String(fd.get('description')||''),active:fd.has('active'),featured:fd.has('featured')};result=editing?await supabase.from('products').update(obj).eq('id',editing):await supabase.from('products').insert(obj)}else if(Object.hasOwn(extras,tab)){
const existing=editing?extras[tab].find(x=>x.id===editing):null;
let image=existing?.image_url||null;
if(tab!=='pages'){
const file=fd.get('content_image');
if(file instanceof File&&file.size){
const extensions={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
if(!extensions[file.type]||file.size>5242880)throw Error('اختر صورة JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميجابايت');
const {data:{user},error:authError}=await supabase.auth.getUser();
if(authError||!user)throw Error('انتهت جلسة المدير');
uploadedPath=`${user.id}/${crypto.randomUUID()}.${extensions[file.type]}`;
const {error:uploadError}=await supabase.storage.from('product-images').upload(uploadedPath,file,{contentType:file.type,upsert:false});
if(uploadError)throw Error('تعذر رفع الصورة: '+report(uploadError));
image=supabase.storage.from('product-images').getPublicUrl(uploadedPath).data.publicUrl;
}}
if(tab==='banners'){
if(!uploadedPath||!image)throw Error('اختر صورة الإعلان');
const obj=existing?{image_url:image}:{title:'إعلان',name:'إعلان',image_url:image,active:true,sort_order:0};
result=existing?await supabase.from('banners').update(obj).eq('id',existing.id).select('id').single():await supabase.from('banners').insert(obj).select('id').single();
}else{
const obj={name:String(fd.get('name')||'').trim(),description:String(fd.get('description')||'').trim(),sort_order:Number(fd.get('sort_order')),active:fd.has('active')};
if(!obj.name||!Number.isInteger(obj.sort_order)||obj.sort_order<0||obj.sort_order>9999)throw Error('تحقق من الاسم والترتيب');
if(tab==='pages'){obj.policy_url=String(fd.get('policy_url')||'').trim()||null;obj.slug=String(fd.get('slug')||'').trim();if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(obj.slug))throw Error('معرف الصفحة غير صحيح');}
else obj.image_url=image;
result=editing?await supabase.from(tab).update(obj).eq('id',editing):await supabase.from(tab).insert(obj);
}}else{const obj={name:String(fd.get('name')).trim(),slug:String(fd.get('slug')).trim(),sort_order:Number(fd.get('sort_order')),active:fd.has('active')};result=editing?await supabase.from('categories').update(obj).eq('id',editing):await supabase.from('categories').insert(obj)}if(result.error)throw result.error;uploadedPath=null;editing=null;await refresh();msg('تم الحفظ في قاعدة البيانات بنجاح')}catch(err){if(uploadedPath){const {error:cleanupError}=await supabase.storage.from('product-images').remove([uploadedPath]);if(cleanupError)console.warn('تعذر تنظيف صورة غير مرتبطة:',cleanupError.message)}msg('تعذر الحفظ: '+report(err),true)}finally{button.disabled=false}}
$('records').addEventListener('click',async e=>{if(customTabs.includes(tab))return;const b=e.target.closest('[data-edit],[data-delete]');if(!b)return;if(b.dataset.edit){editing=b.dataset.edit;render();scrollTo({top:0,behavior:'smooth'});return}if(!confirm('هل تريد حذف السجل نهائياً؟'))return;const table=tab==='products'?'products':tab==='categories'?'categories':tab;const {error}=await supabase.from(table).delete().eq('id',b.dataset.delete).select('id').single();if(error)msg('تعذر الحذف: '+report(error),true);else{await refresh();msg('تم الحذف')}});
$('records').addEventListener('change',async e=>{const el=e.target.closest('[data-status]');if(!el)return;const {error}=await supabase.from('orders').update({status:el.value}).eq('id',el.dataset.status);if(error)msg('تعذر تغيير الحالة: '+report(error),true);else{msg('تم تحديث حالة الطلب');await refresh()}});enter().catch(e=>msg('تعذر الاتصال: '+report(e),true));
</script></body></html>
