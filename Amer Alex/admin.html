<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة | بوتيك العود الأزرق</title><link rel="stylesheet" href="../style.css"></head><body><header><div class="bar"><a class="brand" href="../index.html">بوتيك العود الأزرق<small>لوحة الإدارة</small></a><nav><a class="pill" href="../index.html">فتح المتجر</a><button id="logout" class="hide">تسجيل الخروج</button></nav></div></header><main><div id="message" role="status"></div><section id="loginPanel" class="glass" style="max-width:480px;margin:30px auto"><h1>تسجيل دخول المدير</h1><form id="login"><label>البريد الإلكتروني<input type="email" name="email" autocomplete="username" required></label><label>كلمة المرور<input type="password" name="password" autocomplete="current-password" required minlength="6"></label><button class="primary">دخول</button></form></section><div id="dashboard" class="hide"><h1>إدارة المتجر</h1><nav class="row"><button data-tab="products">المنتجات</button><button data-tab="categories">الأقسام</button><button data-tab="orders">الطلبات</button><button data-tab="settings">الإعدادات</button></nav><section class="glass"><h2 id="formTitle"></h2><div id="formArea"></div></section><section class="glass"><h2>السجلات</h2><div id="records"></div></section></div></main><script type="module">
import {supabase,money,safe,report} from '../supabase-config.js';const $=id=>document.getElementById(id);let tab='products',editing=null,products=[],categories=[],orders=[],settings=[];function msg(t,bad=false){$('message').className='notice'+(bad?' error':'');$('message').textContent=t}function option(id,selected){return categories.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${safe(c.name)}</option>`).join('')}
async function check(){const {data:{user},error}=await supabase.auth.getUser();if(error||!user)return false;const {data,error:err}=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(err||!data){await supabase.auth.signOut();msg('الحساب لا يمتلك صلاحية المدير',true);return false}return true}
async function enter(){const allowed=await check();$('loginPanel').classList.toggle('hide',allowed);$('dashboard').classList.toggle('hide',!allowed);$('logout').classList.toggle('hide',!allowed);if(allowed)await refresh()}
$('login').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),btn=e.currentTarget.querySelector('button');btn.disabled=true;const {error}=await supabase.auth.signInWithPassword({email:String(fd.get('email')),password:String(fd.get('password'))});btn.disabled=false;if(error)return msg('تعذر تسجيل الدخول: '+report(error),true);await enter()});$('logout').addEventListener('click',async()=>{await supabase.auth.signOut();$('dashboard').classList.add('hide');$('loginPanel').classList.remove('hide');$('logout').classList.add('hide')});document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;editing=null;render()}));
async function refresh(){const [pr,cr,or,sr]=await Promise.all([supabase.from('products').select('*').order('created_at',{ascending:false}),supabase.from('categories').select('*').order('sort_order'),supabase.from('orders').select('*').order('created_at',{ascending:false}).limit(100),supabase.from('store_settings').select('*')]);for(const r of [pr,cr,or,sr])if(r.error)throw r.error;products=pr.data;categories=cr.data;orders=or.data;settings=sr.data;render()}
function render(){const collection=tab==='products'?products:categories;const p=collection.find(x=>x.id===editing)||{};$('formTitle').textContent=tab==='products'?'إضافة أو تعديل منتج':tab==='categories'?'إضافة أو تعديل قسم':tab==='orders'?'إدارة الطلبات':'إعدادات المتجر';if(tab==='products'){$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>اسم المنتج<input name="name" required maxlength="200" value="${safe(p.name)}"></label><label>السعر (ر.ي)<input name="price" type="number" step="0.01" min="0" required value="${p.price??0}"></label><label>السعر قبل الخصم<input name="compare_at_price" type="number" step="0.01" min="0" value="${p.compare_at_price??''}"></label><label>المخزون<input name="stock" type="number" min="0" step="1" required value="${p.stock??0}"></label><label>القسم<select name="category_id"><option value="">بدون قسم</option>${option('',p.category_id)}</select></label><label class="image-picker">صورة المنتج من الجهاز<input id="productImage" name="product_image" type="file" accept="image/jpeg,image/png,image/webp" style="display:block;width:100%;margin-top:10px" aria-describedby="imageHelp"><small id="imageHelp" class="muted">JPG أو PNG أو WebP — الحد الأقصى 5 ميجابايت. عند التعديل، اترك الحقل فارغًا للاحتفاظ بالصورة الحالية.</small><img id="imagePreview" alt="معاينة صورة المنتج" style="${p.image_url?'':'display:none;'};max-width:180px;max-height:180px;object-fit:contain;border-radius:18px;margin-top:12px;border:1px solid #dfe3e9" src="${safe(p.image_url)}"></label></div><label>الوصف<textarea name="description">${safe(p.description)}</textarea></label><label><input type="checkbox" name="active" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> المنتج ظاهر للعملاء</label><label><input type="checkbox" name="featured" style="width:auto;min-height:auto" ${p.featured?'checked':''}> منتج مميز</label><button class="primary">حفظ المنتج</button><button type="button" id="cancel">إلغاء التعديل</button></form>`}else if(tab==='categories'){$('formArea').innerHTML=`<form id="editor"><div class="formgrid"><label>اسم القسم<input name="name" required maxlength="100" value="${safe(p.name)}"></label><label>معرّف القسم بالإنجليزية<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" value="${safe(p.slug)}" placeholder="oud-perfumes"></label><label>الترتيب<input type="number" name="sort_order" value="${p.sort_order??0}"></label></div><label><input type="checkbox" name="active" style="width:auto;min-height:auto" ${p.active!==false?'checked':''}> القسم ظاهر</label><button class="primary">حفظ القسم</button><button type="button" id="cancel">إلغاء التعديل</button></form>`}else if(tab==='settings'){$('formArea').innerHTML=`<form id="editor"><label>نبذة المتجر<input name="about" value="${safe(settings.find(x=>x.key==='about')?.value?.text||'')}"></label><label>الشريط الإعلاني<input name="ticker" value="${safe(settings.find(x=>x.key==='ticker')?.value?.text||'')}"></label><button class="primary">حفظ الإعدادات</button></form>`}else $('formArea').innerHTML='<p class="muted">يمكنك تحديث حالة الطلب من السجلات أدناه.</p>';
if(tab==='orders')$('records').innerHTML=orders.map(o=>`<div class="item"><div class="grow"><b>${safe(o.tracking_code)}</b> — ${safe(o.customer_name)}<br><span class="muted">${safe(o.customer_phone)} | ${safe(o.delivery_address)}</span><br>${money(o.total)}</div><select style="max-width:190px" data-status="${o.id}">${[['pending','قيد المراجعة'],['confirmed','مؤكد'],['preparing','قيد التجهيز'],['shipped','تم الشحن'],['delivered','تم التسليم'],['cancelled','ملغي']].map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')||'<p>لا توجد طلبات</p>';else if(tab==='settings')$('records').innerHTML='<p class="muted">الإعدادات العامة تظهر في المتجر بعد تحديث الصفحة.</p>';else $('records').innerHTML=collection.map(x=>`<div class="item"><div class="grow"><b>${safe(x.name)}</b> ${tab==='products'?money(x.price):''}<br><small>${safe(x.id)}</small></div><button data-edit="${x.id}">تعديل</button><button class="danger" data-delete="${x.id}">حذف</button></div>`).join('')||'<p>لا توجد سجلات</p>';
const f=$('editor');if(f)f.addEventListener('submit',save);if(tab==='products'){const picker=$('productImage'),preview=$('imagePreview');let objectUrl=null;picker?.addEventListener('change',()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}const file=picker.files?.[0];if(!file){preview.src='';preview.style.display='none';return}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024||file.size===0){picker.value='';msg('اختر صورة JPG أو PNG أو WebP بحجم لا يتجاوز 5 ميجابايت',true);return}objectUrl=URL.createObjectURL(file);preview.src=objectUrl;preview.style.display='block';preview.onload=()=>{if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null}}})}$('cancel')?.addEventListener('click',()=>{editing=null;render()})}
async function save(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f),button=f.querySelector('[type=submit],button');button.disabled=true;let uploadedPath=null;try{let result;if(tab==='settings'){const rows=['about','ticker'].map(key=>({key,value:{text:String(fd.get(key)||'').trim()},public_visible:true}));result=await supabase.from('store_settings').upsert(rows)}else if(tab==='products'){const price=Number(fd.get('price')),compare=fd.get('compare_at_price')===''?null:Number(fd.get('compare_at_price')),stock=Number(fd.get('stock'));if(!Number.isFinite(price)||price<0||compare!==null&&compare<price||!Number.isInteger(stock)||stock<0)throw Error('تحقق من السعر والمخزون');const file=fd.get('product_image');let image=editing?(products.find(p=>p.id===editing)?.image_url||null):null;if(file instanceof File&&file.size>0){const types={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};const extension=types[file.type];if(!extension||file.size>5*1024*1024)throw Error('صيغة الصورة غير مدعومة أو حجمها أكبر من 5 ميجابايت');const {data:{user},error:userError}=await supabase.auth.getUser();if(userError||!user)throw Error('انتهت جلسة المدير، سجل الدخول مجددًا');uploadedPath=`${user.id}/${crypto.randomUUID()}.${extension}`;const {error:uploadError}=await supabase.storage.from('product-images').upload(uploadedPath,file,{contentType:file.type,cacheControl:'3600',upsert:false});if(uploadError)throw Error('تعذر رفع الصورة: '+report(uploadError));const {data:publicData}=supabase.storage.from('product-images').getPublicUrl(uploadedPath);image=publicData.publicUrl;}const obj={name:String(fd.get('name')).trim(),price,compare_at_price:compare,stock,category_id:fd.get('category_id')||null,image_url:image||null,description:String(fd.get('description')||''),active:fd.has('active'),featured:fd.has('featured')};result=editing?await supabase.from('products').update(obj).eq('id',editing):await supabase.from('products').insert(obj)}else{const obj={name:String(fd.get('name')).trim(),slug:String(fd.get('slug')).trim(),sort_order:Number(fd.get('sort_order')),active:fd.has('active')};result=editing?await supabase.from('categories').update(obj).eq('id',editing):await supabase.from('categories').insert(obj)}if(result.error)throw result.error;editing=null;await refresh();msg('تم الحفظ في قاعدة البيانات بنجاح')}catch(err){if(uploadedPath){const {error:cleanupError}=await supabase.storage.from('product-images').remove([uploadedPath]);if(cleanupError)console.warn('تعذر تنظيف صورة غير مرتبطة:',cleanupError.message)}msg('تعذر الحفظ: '+report(err),true)}finally{button.disabled=false}}
$('records').addEventListener('click',async e=>{const b=e.target.closest('[data-edit],[data-delete]');if(!b)return;if(b.dataset.edit){editing=b.dataset.edit;render();scrollTo({top:0,behavior:'smooth'});return}if(!confirm('هل تريد حذف السجل نهائياً؟'))return;const table=tab==='products'?'products':'categories';const {error}=await supabase.from(table).delete().eq('id',b.dataset.delete);if(error)msg('تعذر الحذف: '+report(error),true);else{await refresh();msg('تم الحذف')}});
$('records').addEventListener('change',async e=>{const el=e.target.closest('[data-status]');if(!el)return;const {error}=await supabase.from('orders').update({status:el.value}).eq('id',el.dataset.status);if(error)msg('تعذر تغيير الحالة: '+report(error),true);else{msg('تم تحديث حالة الطلب');await refresh()}});enter().catch(e=>msg('تعذر الاتصال: '+report(e),true));
</script></body></html>
