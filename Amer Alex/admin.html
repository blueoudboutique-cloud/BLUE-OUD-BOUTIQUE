<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة بوتيك العود الأزرق</title><style>*{box-sizing:border-box}body{margin:0;font:14px Tahoma,Arial;background:#f4f6f5;color:#203a32}header{background:#17352e;color:white;padding:20px}main{max-width:1150px;margin:auto;padding:20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#17352e;color:#fff;font:inherit}nav button{background:#e4ebe7;color:#17352e}nav button.active{background:#17352e;color:#fff}.panel{background:white;border:1px solid #dce3df;border-radius:15px;padding:20px;margin-bottom:16px}h2{margin-top:0}input,select,textarea{width:100%;padding:11px;border:1px solid #cfd9d3;border-radius:9px;font:inherit;margin:5px 0 12px}input[type=checkbox]{width:auto}label{display:block;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.list{display:grid;gap:9px}.item{border:1px solid #e3e8e4;border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.item button{margin:2px}.muted{color:#64776b;font-size:12px}.danger{background:#a82e2e}.secondary{background:#e8eeea;color:#17352e}.hidden{display:none}.toast{position:fixed;bottom:15px;right:15px;background:#17352e;color:white;padding:13px;border-radius:10px;display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{display:block}}</style><style id="blue-oud-liquid-glass-v1">
/* BLUE OUD BOUTIQUE — Liquid Glass design system */
:root{--main:#174da4;--gold:#8cb9ff;--bg:#edf4ff;--text:#142b50;--glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.76);--glass-border:rgba(255,255,255,.82);--glass-shadow:0 14px 45px rgba(19,57,120,.12),inset 0 1px 0 rgba(255,255,255,.88);--glass-radius:24px;color-scheme:light}
html{scroll-behavior:smooth}body{background:radial-gradient(ellipse 55% 38% at 5% 4%,#c5dcff 0,transparent 75%),radial-gradient(ellipse 50% 35% at 96% 40%,#d5e8ff 0,transparent 75%),linear-gradient(160deg,#f5f9ff,#eaf2ff 55%,#f8fbff);background-attachment:fixed;color:var(--text);min-height:100vh}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{transition:transform .22s cubic-bezier(.2,.8,.2,1),background-color .22s,border-color .22s,box-shadow .22s}button:active{transform:scale(.96)}:focus-visible{outline:3px solid #428bff;outline-offset:3px}
button{touch-action:manipulation}input,textarea,select{color:var(--text)}
@supports (backdrop-filter:blur(1px)){.glass-surface{backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

header{background:linear-gradient(130deg,rgba(9,46,110,.96),rgba(37,104,197,.93))!important;border-bottom:1px solid #ffffff8a;box-shadow:0 12px 32px #123e8425;padding:26px!important}header h1{margin:0 0 10px;font-size:clamp(21px,3vw,31px)}header a{color:#d6eaff!important}
main{max-width:1200px!important}nav{padding:12px;background:#ffffff85;border:1px solid #fff;border-radius:24px;box-shadow:var(--glass-shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:10px;z-index:5}
nav button{background:#ffffffba!important;border:1px solid #ffffffeb!important;color:#1d5096!important;border-radius:999px!important;box-shadow:0 3px 10px #154c8e0d}
nav button.active{background:linear-gradient(135deg,#3881e2,#174a9a)!important;color:#fff!important;box-shadow:0 6px 15px #1d59ac40}
.panel{background:var(--glass)!important;border:1px solid var(--glass-border)!important;border-radius:26px!important;box-shadow:var(--glass-shadow);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);padding:clamp(16px,3vw,28px)!important}
h2{color:#153e7a}button{background:linear-gradient(135deg,#367de0,#174a9b)!important;color:#fff;border:1px solid #ffffff66!important;border-radius:13px!important;box-shadow:0 4px 14px #1b57aa26}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button.secondary{background:#ffffffb8!important;color:#1c4c8d!important}.danger{background:linear-gradient(135deg,#e45d70,#aa2942)!important}
input,select,textarea{background:#ffffffc4!important;border:1px solid #c5d8f5!important;border-radius:14px!important;min-height:43px}input:focus,select:focus,textarea:focus{outline:2px solid #6ea5f4;outline-offset:1px}
.item{background:#ffffff85!important;border:1px solid #fff!important;border-radius:18px!important;box-shadow:0 5px 18px #1b57a00c}.muted{color:#59759c!important}.toast{background:#174a9b!important;border:1px solid #ffffff8a;border-radius:16px!important;box-shadow:var(--glass-shadow)}
@media(max-width:650px){main{padding:12px!important}nav{top:0;border-radius:18px;padding:8px}.panel{border-radius:20px!important}.item button{margin-top:7px}}
</style><style id="blue-oud-reference-glass-v2">
:root{--main:#07443e!important;--gold:#d9bb82!important;--bg:#dceae6!important;--text:#073e39!important}
body{background:radial-gradient(circle at 5% 0%,#407b70,transparent 40%),linear-gradient(140deg,#0b3733,#b3d0c8 45%,#e6f1ed)!important;background-attachment:fixed!important}
header{background:linear-gradient(120deg,#0c5049c9,#d4eee469)!important;border:1px solid #ffffff7a!important;border-radius:28px!important;margin:14px!important;box-shadow:inset 0 1px #fff8,0 14px 35px #002f2b55!important;backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px)}
main>*,section,.panel,.card,aside{border-radius:25px!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}button{border-radius:14px!important}button:focus-visible,a:focus-visible{outline:3px solid #e5c689;outline-offset:3px}
</style></head><body><header><h1>لوحة إدارة بوتيك العود الأزرق</h1><p>نسخة محلية تجريبية — البيانات محفوظة في هذا المتصفح فقط</p><a href="index.html" style="color:#fff">↗ فتح واجهة المتجر</a></header><main><nav id="tabs"></nav><section class="panel" id="editor"></section><section class="panel"><h2>السجلات الحالية</h2><div id="records" class="list"></div></section></main><div class="toast" id="toast"></div><script>
'use strict';const KEY='blueoud_store_v1',ORD='blueoud_orders_v1';const base={settings:{name:'بوتيك العود الأزرق',about:'عالم العود والعطور الفاخرة',ticker:'مرحباً بكم في بوتيك العود الأزرق',shipping:0},products:[],categories:[],scents:[],ads:[],sections:[{id:'best',name:'الأكثر مبيعاً',type:'best',active:true},{id:'new',name:'وصل حديثاً',type:'new',active:true},{id:'featured',name:'المنتجات المميزة',type:'featured',active:true},{id:'recommended',name:'منتجات قد تعجبك',type:'recommended',active:true}]};function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}let data=read(KEY,base),tab='products',editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(data));toast('تم الحفظ بنجاح')}catch{toast('فشل الحفظ: قد تكون الصورة كبيرة جداً')}}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}const tabs={products:'المنتجات',categories:'الفئات',scents:'الروائح',sections:'الأقسام',ads:'الإعلانات',orders:'الطلبات',settings:'الإعدادات',backup:'نسخة احتياطية'};function switchTab(t){tab=t;editing=null;render()}function render(){ $('tabs').innerHTML=Object.entries(tabs).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${v}</button>`).join('');if(tab==='settings')return settings();if(tab==='backup')return backup();if(tab==='orders')return orders();const arr=data[tab]||[];const p=arr.find(x=>x.id===editing)||{};let fields='';if(tab==='products'){fields=`<div class="grid"><label>اسم المنتج<input name="name" required value="${esc(p.name)}"></label><label>السعر<input type="number" name="price" min="0" required value="${esc(p.price??0)}"></label><label>السعر قبل الخصم<input type="number" name="oldPrice" min="0" value="${esc(p.oldPrice??0)}"></label><label>المخزون<input type="number" name="stock" min="0" required value="${esc(p.stock??0)}"></label><label>الفئة<select name="category"><option value="">بدون</option>${options(data.categories,p.category)}</select></label><label>الرائحة<select name="scent"><option value="">بدون</option>${options(data.scents,p.scent)}</select></label></div><label>صورة المنتج (رابط HTTPS أو صورة مرفوعة)<input name="image" value="${esc(p.image)}"><input type="file" accept="image/*" id="upload"></label><label>الوصف<textarea name="description">${esc(p.description)}</textarea></label><label>الظهور في الأقسام (اختر أكثر من خيار)</label><div>${data.sections.map(x=>`<label style="display:inline-block;margin:7px"><input type="checkbox" name="tags" value="${esc(x.id)}" ${(p.tags||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')}</div><label><input type="checkbox" name="active" ${p.active!==false?'checked':''}> المنتج نشط</label>`}else if(tab==='categories'||tab==='scents'){fields=`<label>الاسم<input name="name" required value="${esc(p.name)}"></label><label>الصورة (رابط أو رفع)<input name="image" value="${esc(p.image)}"><input type="file" id="upload" accept="image/*"></label>`}else if(tab==='sections'){fields=`<label>اسم القسم<input name="name" required value="${esc(p.name)}"></label><label>النوع<select name="type">${[['custom','مخصص'],['best','الأكثر مبيعاً'],['new','وصل حديثاً'],['featured','مميز'],['recommended','مقترح'],['offers','عروض']].map(([k,v])=>`<option value="${k}" ${p.type===k?'selected':''}>${v}</option>`).join('')}</select></label><label><input type="checkbox" name="active" ${p.active!==false?'checked':''}> تفعيل القسم</label>`}else if(tab==='ads'){fields=`<label>موضع الإعلان<select name="position">${[['hero','الرئيسي'],['middle','الوسط'],['bottom','الأسفل']].map(([k,v])=>`<option value="${k}" ${p.position===k?'selected':''}>${v}</option>`).join('')}</select></label><label>النوع<select name="type"><option value="image" ${p.type!=='video'?'selected':''}>صورة</option><option value="video" ${p.type==='video'?'selected':''}>فيديو</option></select></label><label>رابط الوسائط<input name="url" value="${esc(p.url)}"><input type="file" id="upload" accept="image/*,video/*"></label>`} $('editor').innerHTML=`<h2>${editing?'تعديل':'إضافة'} ${tabs[tab]}</h2><form id="form">${fields}<button type="submit">حفظ</button> ${editing?'<button type="button" class="secondary" onclick="editing=null;render()">إلغاء</button>':''}</form>`;$('form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),obj={...p,id:p.id||crypto.randomUUID()};for(const [k,v] of fd.entries())if(k!=='tags')obj[k]=v;if(tab==='products'){obj.tags=fd.getAll('tags');for(const k of ['price','oldPrice','stock'])obj[k]=Math.max(0,Number(obj[k]||0));obj.active=fd.has('active')}if(tab==='sections')obj.active=fd.has('active');const file=$('upload')?.files[0];if(file){if(file.size>900000){toast('حجم الملف كبير. استخدم رابط وسائط أو صورة أصغر من 900 كيلوبايت');return}obj[tab==='ads'?'url':'image']=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);save();editing=null;render()};$('records').innerHTML=arr.map((x,i)=>`<div class="item"><span><b>${esc(x.name||x.position)}</b><br><small>${esc(x.id)}</small></span><span><button class="secondary" onclick="editing='${esc(x.id)}';render()">تعديل</button><button class="secondary" onclick="move(${i},-1)">↑</button><button class="secondary" onclick="move(${i},1)">↓</button><button class="danger" onclick="removeItem('${esc(x.id)}')">حذف</button></span></div>`).join('')||'<p class="muted">لا توجد سجلات.</p>'}function options(items,selected){return(items||[]).map(x=>`<option value="${esc(x.id)}" ${selected===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}function move(i,d){const a=data[tab],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}function removeItem(id){if(!confirm('تأكيد الحذف؟'))return;data[tab]=data[tab].filter(x=>x.id!==id);save();render()}function settings(){const s=data.settings||{};$('editor').innerHTML=`<h2>إعدادات المتجر</h2><form id="form"><label>اسم المتجر<input name="name" value="${esc(s.name)}" required></label><label>نبذة<input name="about" value="${esc(s.about)}"></label><label>الشريط المتحرك<input name="ticker" value="${esc(s.ticker)}"></label><label>اللون الرئيسي<input name="color" type="color" value="${esc(s.color||'#17352e')}"></label><label>الشحن<input name="shipping" type="number" min="0" value="${esc(s.shipping||0)}"></label><button>حفظ الإعدادات</button></form>`;$('records').innerHTML='<p class="muted">تظهر التغييرات في واجهة المتجر بعد تحديث الصفحة.</p>';$('form').onsubmit=e=>{e.preventDefault();data.settings=Object.fromEntries(new FormData(e.target).entries());save()}}function orders(){const list=read(ORD,[]);$('editor').innerHTML='<h2>الطلبات المحلية</h2><p>الطلبات تظهر هنا فقط إذا أُنشئت من واجهة المتجر على نفس النطاق والمتصفح.</p>';$('records').innerHTML=list.map(o=>`<div class="item"><div><b>${esc(o.id)}</b> — ${esc(o.customer?.name)}<br>${esc(o.customer?.phone)} — ${Number(o.total||0).toLocaleString('ar')} ر.ي</div><select onchange="updateOrder('${esc(o.id)}',this.value)">${['تم استلام الطلب','قيد التجهيز','تم الشحن','خرج للتوصيل','تم التسليم','ملغي'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')||'لا توجد طلبات'}function updateOrder(id,status){const a=read(ORD,[]),o=a.find(x=>x.id===id);if(o){o.status=status;localStorage.setItem(ORD,JSON.stringify(a));toast('تم تحديث حالة الطلب')}}function backup(){$('editor').innerHTML='<h2>نسخ احتياطي واستعادة</h2><button onclick="downloadBackup()">تنزيل نسخة JSON</button><p>استعادة البيانات تستبدل إعدادات ومنتجات المتجر الحالية.</p><input type="file" id="restore" accept="application/json"><button onclick="restoreBackup()">استعادة</button>';$('records').innerHTML=''}function downloadBackup(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='blueoud-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restoreBackup(){const f=$('restore').files[0];if(!f)return toast('اختر ملف JSON');try{const d=JSON.parse(await f.text());if(!Array.isArray(d.products)||!Array.isArray(d.categories)||!Array.isArray(d.scents)||!Array.isArray(d.sections)||!Array.isArray(d.ads)||!d.settings)throw Error('invalid');if(!confirm('استبدال البيانات الحالية؟'))return;data=d;save();render()}catch{toast('ملف النسخة الاحتياطية غير صالح')}}render();</script></body></html>
